services:
  db:
    image: postgres:15
    container_name: clothing_shop_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clothing_shop_db
    ports:
       - "5433:5432"   # changed from 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: clothing_shop_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/clothing_shop_db
    ports:
      - "8009:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data: